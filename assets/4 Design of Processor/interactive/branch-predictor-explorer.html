<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Two-bit branch predictor explorer</title>
<style>
:root{font:16px system-ui, -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Noto Sans SC",sans-serif;color:#172033;background:#f7f9fc}body{max-width:780px;margin:0 auto;padding:18px}main{background:#fff;border:1px solid #d9e2ef;border-radius:12px;padding:18px}h1{font-size:1.35rem;margin-top:0}button{font:inherit;padding:8px 12px;margin:4px;border:1px solid #2563eb;border-radius:7px;background:#eff6ff;color:#1d4ed8;cursor:pointer}.state{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:18px 0}.state div{padding:12px 5px;text-align:center;border:1px solid #cbd5e1;border-radius:7px}.current{background:#bfdbfe!important;border-color:#2563eb!important;font-weight:700}.card{padding:12px;background:#f1f5f9;border-radius:8px;margin-top:12px}.good{color:#047857}.bad{color:#b91c1c}.note{font-size:.9rem;color:#526071}@media(max-width:520px){.state{grid-template-columns:1fr 1fr}}
</style>
<main><h1>互动：2-bit dynamic branch predictor</h1><p>先观察默认的 strongly taken，再输入实际结果。连续点击同一结果，看状态逐步移动；然后点击一次相反结果，看它为什么不会立刻完全翻转。</p><div class="state"><div id="0">Strongly<br>not taken</div><div id="1">Weakly<br>not taken</div><div id="2">Weakly<br>taken</div><div id="3">Strongly<br>taken</div></div><button id="taken" type="button">实际结果：Taken</button><button id="not" type="button">实际结果：Not taken</button><button id="reset" type="button">重置</button><div class="card" id="out" aria-live="polite"></div><p class="note">这是教学模型：2-bit saturating counter 需要连续证据才跨过强弱边界，避免一次异常分支就完全改变预测。</p></main>
<script>
let state=3,correct=0,total=0;function render(actual){const prediction=state>=2;let line='当前预测：'+(prediction?'Taken':'Not taken');if(actual!==undefined){total++;if(prediction===actual)correct++;state=actual?Math.min(3,state+1):Math.max(0,state-1);line+='；本次'+(prediction===actual?'预测正确':'误预测')}document.querySelectorAll('.state div').forEach(x=>x.classList.toggle('current',Number(x.id)===state));document.getElementById('out').textContent=line+'。累计准确率：'+(total?(correct+'/'+total+' = '+Math.round(correct/total*100)+'%'):'尚无样本')+'。';}document.getElementById('taken').addEventListener('click',()=>render(true));document.getElementById('not').addEventListener('click',()=>render(false));document.getElementById('reset').addEventListener('click',()=>{state=3;correct=0;total=0;render()});render();
</script>
