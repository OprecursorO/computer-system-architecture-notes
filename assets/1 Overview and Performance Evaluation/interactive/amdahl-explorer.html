<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Amdahl's Law explorer</title>
<style>
:root{font:16px system-ui, -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Noto Sans SC",sans-serif;color:#172033;background:#f7f9fc}body{max-width:760px;margin:0 auto;padding:18px}main{background:white;border:1px solid #d9e2ef;border-radius:12px;padding:18px}h1{font-size:1.35rem;margin-top:0}label{display:block;margin:14px 0 5px;font-weight:650}input{width:100%;accent-color:#2563eb}output{font-weight:700;color:#1d4ed8}table{width:100%;border-collapse:collapse;margin-top:18px}td,th{padding:8px;border-bottom:1px solid #e5e7eb;text-align:left}.bar{height:24px;background:#e5e7eb;border-radius:5px;overflow:hidden;margin-top:14px}.fill{height:100%;background:#2563eb;width:0;transition:width .15s}.note{font-size:.9rem;color:#526071}
</style>
<main>
<h1>互动：Amdahl's Law 的并行上限</h1>
<p>问题：程序有多少部分能并行？增加 processor 后，整体究竟能快多少？拖动两个滑块观察“串行部分”为什么会成为上限。</p>
<label for="parallel">可并行比例：<output id="parallelOut"></output></label><input id="parallel" type="range" min="0" max="100" value="80">
<label for="processors">processor 数量：<output id="processorsOut"></output></label><input id="processors" type="range" min="1" max="64" value="4">
<table><tr><th>结果</th><th>数值</th></tr><tr><td>串行比例</td><td id="serial"></td></tr><tr><td>理论 speedup</td><td id="speedup"></td></tr><tr><td>并行后耗时（原程序=100）</td><td id="time"></td></tr></table>
<div class="bar"><div class="fill" id="fill"></div></div><p id="message" aria-live="polite"></p><p class="note">这是根据课件公式的理想化教学计算，不包含 communication、synchronization 和 load imbalance 开销。</p>
</main>
<script>
const $=id=>document.getElementById(id);function update(){const parallel=+$('parallel').value/100,processors=+$('processors').value;const serial=1-parallel,time=serial+parallel/processors,speedup=1/time;$('parallelOut').textContent=Math.round(parallel*100)+'%';$('processorsOut').textContent=processors;$('serial').textContent=Math.round(serial*100)+'%';$('speedup').textContent=speedup.toFixed(2)+'×';$('time').textContent=(time*100).toFixed(1);$('fill').style.width=Math.min(speedup/16*100,100)+'%';$('message').textContent=serial===0?'边界状态：没有串行部分，理想 speedup 可以接近 processor 数量。':processors===1?'边界状态：只有 1 个 processor，没有并行加速。':'当前瓶颈：串行部分仍占 '+Math.round(serial*100)+'%，processor 越多，新增收益越小。'};['parallel','processors'].forEach(id=>$(id).addEventListener('input',update));update();
</script>
