<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RISC-V instruction fields</title>
<style>:root{font:16px system-ui, -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Noto Sans SC",sans-serif;color:#172033;background:#f7f9fc}body{max-width:800px;margin:0 auto;padding:18px}main{background:#fff;border:1px solid #d9e2ef;border-radius:12px;padding:18px}h1{font-size:1.35rem;margin-top:0}select{font:inherit;padding:8px;margin:4px 0 12px}.word{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:14px 0}.field{padding:12px 5px;text-align:center;border-radius:7px;background:#dbeafe;border:1px solid #60a5fa;font-family:ui-monospace,monospace}.field small{display:block;font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Noto Sans SC",sans-serif;color:#334155;margin-top:5px}.explain{padding:12px;background:#f1f5f9;border-left:4px solid #2563eb}.note{font-size:.9rem;color:#526071}
</style>
<main><h1>互动：instruction 是怎样分成字段的？</h1><p>选择一个 RISC-V instruction。观察同一个 32-bit instruction word 如何被拆成 opcode、寄存器和 immediate。它帮助你理解 ISA 是 software 与 hardware 的共同约定。</p><label for="kind">instruction 类型：</label><select id="kind"><option value="R">R-type：add</option><option value="I">I-type：addi</option><option value="S">S-type：sd</option><option value="B">B-type：beq</option></select><div class="word" id="word"></div><div class="explain" id="explain"></div><p class="note">这是按课件介绍的字段角色制作的结构示意，不是完整 assembler，也不替代具体十六进制编码练习。</p></main>
<script>
const data={R:[['funct7','7 bits'],['rs2','5 bits'],['rs1','5 bits'],['funct3','3 bits'],['rd','5 bits'],['opcode','7 bits']],I:[['imm[11:0]','12 bits'],['rs1','5 bits'],['funct3','3 bits'],['rd','5 bits'],['opcode','7 bits']],S:[['imm[11:5]','7 bits'],['rs2','5 bits'],['rs1','5 bits'],['funct3','3 bits'],['imm[4:0]','5 bits'],['opcode','7 bits']],B:[['imm[12|10:5]','7 bits'],['rs2','5 bits'],['rs1','5 bits'],['funct3','3 bits'],['imm[4:1|11]','5 bits'],['opcode','7 bits']]};
const desc={R:'R-type：两个 register 进入 ALU，结果写入 rd。重点看它有两个 source register 和一个 destination register。',I:'I-type：一个 register 与 immediate 进入 ALU，适合 addi、load 等操作。',S:'S-type：不写回 rd，而是把 register 的值写入 memory；immediate 被拆成两段。',B:'B-type：比较两个 register，条件成立时改变 PC；branch offset 被拆成两段。'};
function render(){const kind=document.getElementById('kind').value;const word=document.getElementById('word');word.replaceChildren();data[kind].forEach(([name,width])=>{const field=document.createElement('div');field.className='field';field.textContent=name;const small=document.createElement('small');small.textContent=width;field.appendChild(small);word.appendChild(field)});document.getElementById('explain').textContent=desc[kind]+' 这只是字段角色示意，不是完整 assembler。'}document.getElementById('kind').addEventListener('change',render);render();
</script>
